<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">High-reliability first-time build program</title>
  <desc id="desc">A gated manufacturing workflow progressing from requirements through validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#113f65" />
      <stop offset="100%" stop-color="#0f5e5d" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" />
  <rect x="90" y="80" width="780" height="380" rx="24" fill="#ffffff" opacity="0.1" />
  <path d="M180 270H760" stroke="#d4e4f2" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <g fill="#f5fbff">
    <rect x="150" y="220" width="130" height="100" rx="14" opacity=".96"/>
    <rect x="325" y="220" width="130" height="100" rx="14" opacity=".9"/>
    <rect x="500" y="220" width="130" height="100" rx="14" opacity=".84"/>
    <rect x="675" y="220" width="130" height="100" rx="14" opacity=".78"/>
  </g>
  <g fill="#224f73" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="215" y="278">PLAN</text>
    <text x="390" y="278">BUILD</text>
    <text x="565" y="278">INSPECT</text>
    <text x="740" y="278">VALIDATE</text>
  </g>
  <text x="150" y="450" fill="#f5fbff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">High-Reliability First-Time Build</text>
</svg>
